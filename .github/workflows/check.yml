name: Check site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate data files
        run: ruby scripts/validate_data.rb
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
      - name: No empty links in built output
        run: |
          if grep -rEn "href=(\"\"|'')" _site --include=*.html; then
            echo "Empty href found"; exit 1
          fi
      - name: Funding statement on every page
        run: |
          for f in $(find _site -name '*.html'); do
            grep -q "grant agreement N° 101000213" "$f" || { echo "Missing funding statement: $f"; exit 1; }
          done
